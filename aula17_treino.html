<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>

<title>INSS · Aula 17 — Contagem Recíproca e Compensação Financeira</title>
<style>
:root{
  --teal:#0f6e56;--teal-dk:#0d5c46;--teal-lt:#e1f5ee;
  --amber:#b45309;--amber-lt:#fef3c7;
  --red:#991b1b;--red-lt:#fee2e2;
  --green:#166534;--green-lt:#dcfce7;
  --bg:#faf9f5;--surface:#fff;--border:#e5e7eb;
  --text:#1f2937;--muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;padding-bottom:80px}
.hd{background:var(--teal);color:#fff;padding:14px 18px 12px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.hd h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.hd .sub{font-size:11.5px;opacity:.8;margin-top:1px}
.hd-count{font-size:13px;opacity:.88;white-space:nowrap}
.pb-bg{background:rgba(255,255,255,.28);border-radius:99px;height:5px;overflow:hidden}
.pb-fill{background:#fff;height:100%;border-radius:99px;transition:width .4s ease}
.pb-label{font-size:10.5px;opacity:.85;margin-top:3px;text-align:right}
.ctrl{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--border)}
.btn{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);
  background:#fff;font-size:12.5px;font-weight:500;cursor:pointer;
  color:var(--text);transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.danger{border-color:#dc2626;color:#dc2626}
.btn.danger:hover{background:#dc2626;color:#fff}
.stats{display:flex;gap:14px;padding:9px 16px;
  background:var(--bg);border-bottom:1px solid var(--border);font-size:12.5px}
.stat{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%}
.dot-g{background:#16a34a}.dot-r{background:#dc2626}.dot-gr{background:#d1d5db}
.cw{padding:12px 14px}
.card{background:#fff;border-radius:14px;
  box-shadow:0 1px 6px rgba(0,0,0,.09);overflow:hidden;position:relative}
.card-meta{padding:9px 14px 8px;background:#f8f8f8;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:2px 9px;
  border-radius:20px;letter-spacing:.2px}
.b-num{background:var(--teal-lt);color:var(--teal)}
.b-cespe{background:#dbeafe;color:#1e40af}
.b-inedita{background:#f3e8ff;color:#7c3aed}
.b-outro{background:#fef3c7;color:#92400e}
.b-mc{background:#e0e7ff;color:#3730a3}
.card-cargo{font-size:10.5px;color:var(--muted)}
.card-body{padding:16px 14px}
.enunciado{font-size:15px;line-height:1.62;color:var(--text);font-weight:400}
.ans-row{display:flex;gap:12px;padding:12px 14px 14px}
.ans-btn{flex:1;padding:13px;border-radius:12px;border:2px solid var(--border);
  font-size:15px;font-weight:700;cursor:pointer;background:#fff;
  transition:all .15s;letter-spacing:.4px}
.ans-btn:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,0,0,.13)}
.ans-btn:disabled{cursor:default}
.ans-btn.cv{border-color:#16a34a;color:#16a34a}
.ans-btn.ce{border-color:#dc2626;color:#dc2626}
.ans-btn.sel-ok{background:#16a34a;color:#fff;border-color:#16a34a}
.ans-btn.sel-ng{background:#dc2626;color:#fff;border-color:#dc2626}
.ans-btn.rev-ok{background:#dcfce7;border-color:#16a34a;color:#16a34a}
.mc-col{display:flex;flex-direction:column;gap:9px;padding:12px 14px 14px}
.mc-btn{display:flex;align-items:flex-start;gap:9px;text-align:left;
  padding:11px 13px;border-radius:11px;border:2px solid var(--border);
  font-size:13.5px;line-height:1.45;font-weight:500;cursor:pointer;
  background:#fff;color:var(--text);transition:all .15s}
.mc-btn:hover:not(:disabled){border-color:var(--teal);transform:translateY(-1px)}
.mc-btn:disabled{cursor:default}
.mc-btn .lt{font-weight:800;flex-shrink:0}
.mc-btn.sel-ok{background:#16a34a;color:#fff;border-color:#16a34a}
.mc-btn.sel-ng{background:#dc2626;color:#fff;border-color:#dc2626}
.mc-btn.rev-ok{background:#dcfce7;border-color:#16a34a;color:#16a34a}
.stamp-ov{position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .28s;z-index:10}
.stamp-ov.show{opacity:1}
.stamp{font-size:42px;font-weight:900;letter-spacing:3px;
  transform:rotate(-20deg);border:5px solid;padding:5px 16px;
  border-radius:6px;text-transform:uppercase;text-align:center}
.stc{color:#16a34a;border-color:#16a34a;opacity:.58}
.ste{color:#dc2626;border-color:#dc2626;opacity:.58}
.fb{margin:0 14px 14px;border-radius:10px;overflow:hidden;display:none}
.fb.show{display:block}
.fb-hd{padding:9px 13px;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:7px}
.fb-bd{padding:10px 13px 12px;font-size:13.5px;line-height:1.58}
.fb.ok .fb-hd{background:var(--green-lt);color:var(--green)}
.fb.ok .fb-bd{background:#f0fdf4;color:#14532d}
.fb.ng .fb-hd{background:var(--red-lt);color:var(--red)}
.fb.ng .fb-bd{background:#fff5f5;color:#7f1d1d}
.arm{color:#dc2626;font-weight:600}
.nav-row{display:flex;gap:10px;padding:0 14px 14px}
.nav-btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);
  background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;
  color:var(--text);transition:all .2s}
.nav-btn:hover{background:var(--bg)}
.nav-btn.nx{background:var(--teal);color:#fff;border-color:var(--teal)}
.nav-btn.nx:hover{background:var(--teal-dk)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ico{font-size:48px;margin-bottom:12px}
.empty h3{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)}
.empty p{font-size:14px;line-height:1.5}
.results{padding:24px 16px;text-align:center}
.r-ico{font-size:56px;margin-bottom:10px}
.results h2{font-size:22px;font-weight:800;margin-bottom:6px}
.r-score{font-size:52px;font-weight:900;color:var(--teal);line-height:1;margin:10px 0}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.r-stat{background:#fff;border-radius:12px;padding:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)}
.r-stat .n{font-size:28px;font-weight:800}
.r-stat .lbl{font-size:11.5px;color:var(--muted);margin-top:2px}
.r-stat.g .n{color:#16a34a}.r-stat.r .n{color:#dc2626}
.r-btn{display:block;width:100%;padding:14px;border-radius:12px;
  margin-top:10px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.r-btn.main{background:var(--teal);color:#fff}
.r-btn.sec{background:#fff;color:var(--text);border:1.5px solid var(--border)}
@media(max-width:400px){
  .enunciado{font-size:14px}.stamp{font-size:32px}.ans-btn{font-size:14px}
}
</style>
</head>

<script>
const KEY = 'inss_a17_erradas';
const Q = [
  {
    id:1, banca:"Outras", cargo:"Procurador do Tribunal de Contas do Município do Rio de Janeiro/2015", type:"mc",
    e:"Em termos de contagem recíproca, conforme dispositivos normativos que regulam a matéria,",
    opts:[
      "será admitida a contagem em dobro do tempo de contribuição na atividade privada no regime geral e na Administração pública no regime próprio.",
      "será possível, mesmo sem a compensação financeira, a contagem recíproca de contribuições nos regimes geral, próprio e complementar, desde que tenha havido 1/3 de contribuição em cada período, para obtenção do benefício previdenciário postulado.",
      "é possível para efeito de contagem recíproca de contribuição nos regimes geral e próprio a contagem de tempo fictício, mas este será reduzido pela metade.",
      "terá o segurado o direito de computar, para fins de concessão de aposentadoria prevista no regime geral, o tempo de contribuição no serviço público, desde que não concomitantes.",
      "será permitida a contagem recíproca de tempo de contribuição, desde que o segurado tenha contribuído para o regime geral da previdência e um regime complementar, não computando tempo de contribuição para o regime próprio do serviço público, diante da impossibilidade de compensação financeira."
    ],
    g:"D",
    c:"a) INCORRETA — o art. 96, I, da Lei 8.213/91 veda expressamente a contagem em dobro. b) INCORRETA — não há previsão legal de contagem recíproca com regime complementar. c) INCORRETA — não existe previsão de contagem de tempo fictício reduzido pela metade; tempo fictício é sempre vedado. d) <strong>CORRETA</strong> — nos termos do art. 94 da Lei 8.213/91, é assegurada a contagem recíproca do tempo de contribuição/serviço na administração pública, desde que não concomitante com o RGPS. e) INCORRETA — mesma razão da b), não há previsão com regime complementar."
  },
  {
    id:2, banca:"Outras", cargo:'Analista Judiciário (TRT 2ª Região)/Judiciária/"Sem Especialidade"/2014', type:"mc",
    e:"Para efeito de aposentadoria perante o regime próprio, o tempo de contribuição regularmente feito pelo segurado no regime geral",
    opts:[
      "poderá ser computado, hipótese em que os diversos regimes previdenciários se compensarão financeiramente.",
      "poderá ser computado, mediante pedido de restituição, pelo segurado, das contribuições vertidas e posterior recolhimento indenizatório perante o regime instituidor do benefício.",
      "estará assegurado apenas perante o regime dos servidores públicos da União, por se tratar de contribuições recolhidas a uma autarquia federal.",
      "não poderá ser computado, senão mediante aplicação do chamado fator previdenciário.",
      "não poderá ser computado, a menos que haja reciprocidade prevista, facultativamente, na legislação do respectivo ente político."
    ],
    g:"A",
    c:"a) <strong>CORRETA</strong> — nos termos do art. 94 da Lei 8.213/91, é assegurada a contagem recíproca do tempo de contribuição, com compensação financeira entre os regimes. b) INCORRETA — não existe previsão legal de restituição pelo segurado com recolhimento indenizatório. c) INCORRETA — não é exclusivo ao regime da União. d) INCORRETA — não é necessária aplicação do fator previdenciário para o cômputo. e) INCORRETA — o direito não depende de reciprocidade facultativa prevista pelo ente político."
  },
  {
    id:3, banca:"Outras", cargo:"NC-UFPR - Advogado (FPMA)/2019", type:"mc",
    e:'As pessoas podem se inserir no mercado de trabalho de diversas formas, seja na iniciativa privada, seja laborando para a Administração Pública. Em relação ao tema da contagem recíproca de tempo de contribuição e compensação financeira entre regimes previdenciários, assinale a alternativa INCORRETA.',
    opts:[
      "O tempo de contribuição federal, estadual ou municipal será contado para efeito de aposentadoria, e o tempo de serviço correspondente, para efeito de disponibilidade.",
      "O aproveitamento de tempo de contribuição de regime previdenciário diverso daquele em que atualmente se encontra inserido o servidor público se dá através da expedição de Certidão de Tempo de Contribuição (CTC).",
      "O regime previdenciário em que efetivamente se aposentará o servidor público civil é denominado de regime instituidor.",
      "É permitido o aproveitamento de tempo de contribuição realizado na iniciativa privada, perante o Regime Geral de Previdência Social, para os regimes próprios de previdência, sendo, nesse caso, dispensada a compensação financeira entre os regimes.",
      "A Constituição Federal de 1988 permite a contagem recíproca do tempo de contribuição, mas veda o aproveitamento de tempo de contribuição fictício, a exemplo da utilização de períodos de licença-prêmio não usufruída oportunamente, para fins de antecipação do momento da aposentadoria."
    ],
    g:"D",
    c:"A questão pede a alternativa INCORRETA. a) correta (art. 40, §9º, CF). b) correta (art. 96, VII, Lei 8.213/91). c) correta (art. 2º, II, Lei 9.796/99). d) <span class='arm'>⚠️ é a INCORRETA</span> — a compensação financeira NÃO é dispensada; pelo contrário, o art. 94 da Lei 8.213/91 estabelece que os regimes se compensarão financeiramente sempre que houver contagem recíproca. e) correta (arts. 40 §10 e 201 §9º da CF)."
  },
  {
    id:4, banca:"VUNESP", cargo:"Procurador (IPSM SJC)/2018", type:"mc",
    e:"Sobre a compensação financeira entre o Regime Geral de Previdência Social e os regimes de previdência dos servidores da União, dos Estados, do Distrito Federal e dos Municípios, nos casos de contagem recíproca de tempo de contribuição para efeito de aposentadoria, assinale a alternativa que está em consonância com a Lei nº 9.796/1999.",
    opts:[
      "Regime instituidor é o regime previdenciário ao qual o segurado ou servidor público esteve vinculado sem que dele receba aposentadoria ou tenha gerado pensão para seus dependentes.",
      "Os regimes próprios de previdência de servidores da União, dos Estados, do Distrito Federal e dos Municípios só serão considerados regimes de origem quando o Regime Geral de Previdência Social for o regime instituidor.",
      "Na hipótese de o regime previdenciário próprio dos servidores da União, dos Estados e dos Municípios possuir personalidade jurídica própria, os respectivos entes federados respondem subsidiariamente pelas obrigações previstas na Lei nº 9.796/1999.",
      "Cada regime próprio de previdência de servidor público tem direito, como regime de origem, de receber do Regime Geral de Previdência Social, enquanto regime instituidor, compensação financeira.",
      "O valor da compensação financeira devida pelo Regime Geral de Previdência Social será reajustado nas mesmas datas e pelos mesmos índices de reajustamento do salário-mínimo."
    ],
    g:"B",
    c:"<span class='arm'>⚠️ pegadinha de regime de origem x instituidor:</span> a) INCORRETA — essa é a definição de <em>regime de origem</em>, não de regime instituidor (art. 2º, I, Lei 9.796/99). b) <strong>CORRETA</strong> (art. 2º, §1º, Lei 9.796/99). c) INCORRETA — a responsabilidade é <strong>solidária</strong>, não subsidiária (art. 8º, parágrafo único). d) INCORRETA — inverte os papéis: o correto é 'como regime instituidor, de receber... enquanto regime de origem' (art. 4º). e) INCORRETA — o reajuste segue os índices dos benefícios da Previdência Social, nunca do salário-mínimo (art. 4º, §5º)."
  },
  {
    id:5, banca:"CESPE", cargo:"Procurador do Estado de Pernambuco/2018", type:"mc",
    e:"José é servidor do estado de Pernambuco desde 1.º/3/2005. Além disso, é segurado do RGPS, como contribuinte individual, desde 9/2/1990. Considerando-se o entendimento dos tribunais superiores, nessa situação hipotética, José",
    opts:[
      "incorre em ilegalidade, pois não é permitido ao servidor do estado estar vinculado, concomitantemente, ao RGPS.",
      "não poderá auferir a aposentadoria dos dois regimes de previdência, ainda que cumpra, separadamente, os requisitos de cada um.",
      "poderá auferir dois benefícios de aposentadoria, um de cada regime, tendo direito à contagem em dobro do período exercido em concomitância.",
      "não poderá requerer contagem recíproca do tempo de contribuição.",
      "terá direito à contagem recíproca do tempo de contribuição apenas em relação aos períodos que não foram exercidos em concomitância."
    ],
    g:"E",
    c:"Essa é a questão-espelho do nosso caso do Miguel! a) INCORRETA — é permitido ao servidor ficar vinculado concomitantemente ao RGPS quando exerce outra atividade abrangida por ele (Decreto 3.048/99, art. 10, §2º). b) INCORRETA — José PODE auferir as duas aposentadorias separadamente, desde que cumpra os requisitos de cada regime (entendimento do STJ, AgRg no REsp 924.423/RS). c) INCORRETA — não há contagem em dobro (art. 96, I, Lei 8.213/91). d) INCORRETA — a contagem recíproca é direito constitucional (art. 201, §9º, CF). e) <strong>CORRETA</strong> — a contagem recíproca só vale para os períodos NÃO concomitantes (art. 96, II, Lei 8.213/91)."
  },
  {
    id:6, banca:"CESPE", cargo:"Procurador do Município de Manaus/2018", type:"ce",
    e:"Lúcia, servidora da PGM/Manaus desde 1.º/1/1998, requereu a averbação dos períodos em que trabalhou em um escritório de advocacia — de 1.º/1/1992 a 31/12/1996 — e que exerceu a docência em rede de ensino privada — de 1.º/1/2002 a 31/12/2005 —, a fim de aumentar seu tempo de contribuição. É possível que o requerimento de Lúcia seja indeferido por completo sob o fundamento de inadmissibilidade, nas condições narradas, de contagem recíproca.",
    g:"E",
    c:"O ponto central está no 'indeferido por completo'. O período no escritório de advocacia (1992–1996), anterior ao ingresso no serviço público, <strong>será contado normalmente</strong> como tempo de contribuição. Já o período de docência (2002–2005) <strong>não será contado</strong>, pois foi exercido concomitantemente com o cargo público — situação vedada pelo art. 96, II, da Lei 8.213/91. Como apenas parte do pedido deve ser negada, o indeferimento não pode ser 'por completo'. Gabarito: ERRADO."
  },
  {
    id:7, banca:"CS UFG", cargo:"Analista (APARECIDAPREV)/Previdenciário/2018", type:"mc",
    e:"J. P., hoje servidor público municipal, exerceu, antes da admissão em cargo público, a atividade de professor em uma instituição de ensino privada. J. P. deseja averbar o tempo não concomitante prestado como professor junto ao Regime Próprio de Previdência Social para computar o lapso exigido para a aposentadoria. De acordo com esta situação, a averbação do tempo",
    opts:[
      "poderá ocorrer em virtude do instituto da compensação financeira.",
      "não poderá ocorrer, pois o segurado que filiar-se e reverter contribuições a um determinado regime previdenciário deverá preencher os requisitos para aposentar-se no respectivo regime a que estiver vinculado.",
      "poderá ocorrer em virtude do instituto da contagem recíproca e da compensação financeira.",
      "não poderá ocorrer, haja vista o STF ter reconhecido a impossibilidade de cômputo de tempo trabalhado em diferentes regimes previdenciários."
    ],
    g:"C",
    c:"c) <strong>CORRETA</strong> — a averbação decorre conjuntamente da <em>contagem recíproca</em> (que transfere o tempo entre regimes) e da <em>compensação financeira</em> (que ajusta o repasse entre os regimes envolvidos), nos termos do art. 201, §9º, da CF. As demais alternativas negam um direito constitucionalmente assegurado."
  },
  {
    id:8, banca:"CESPE", cargo:"Analista de Gestão Educacional (SEDF)/Direito e Legislação/2017", type:"ce",
    e:"Situação hipotética: Juliano foi empregado de uma empresa privada por aproximadamente oito anos, quando então pediu rescisão do seu contrato por ter sido aprovado em um concurso público, cujo ente encontra-se vinculado a regime próprio de previdência social (RPPS). Assertiva: Nessa situação, para efeito de aposentadoria por tempo de contribuição ao RPPS, o empregado poderá valer-se do tempo de contribuição do RGPS.",
    g:"C",
    c:"O regime previdenciário do servidor público vinculado a RPPS não é o mesmo dos trabalhadores da iniciativa privada (RGPS), mas a Constituição Federal garante a contagem recíproca do tempo de contribuição — o tempo laborado em um regime pode ser transferido e computado no outro, nos termos do art. 40, §9º, da CF. Gabarito: CERTO."
  },
  {
    id:9, banca:"CESPE", cargo:'Analista Judiciário (TRT 7ª Região)/Judiciária/"Sem Especialidade"/2017', type:"mc",
    e:"Paula foi empregada de uma empresa por dez anos, onde exerceu atividade sujeita a condições especiais. Nesse período, ela contribuiu regularmente para o regime geral de previdência social (RGPS). Aprovada em concurso público, na qualidade de servidora pública estatutária, Paula pretende computar, no regime próprio de previdência social (RPPS), o tempo que contribuiu para o regime geral. Nessa situação hipotética, Paula",
    opts:[
      "poderá computar em dobro os dez anos de contribuição tanto no RGPS quanto no RPPS.",
      "não poderá computar o tempo de contribuição para o RGPS no RPPS, por expressa vedação legal.",
      "somente terá direito à contagem recíproca do tempo de contribuição se ela mesma compensar financeiramente o RPPS.",
      "terá direito somente ao cômputo dos dez anos."
    ],
    g:"D",
    c:"a) INCORRETA — vedada a contagem em dobro (art. 96, I, Lei 8.213/91). b) INCORRETA — o cômputo é permitido, é justamente a contagem recíproca (art. 40, §9º, CF). c) INCORRETA — não há previsão legal de que o próprio segurado precise compensar financeiramente o regime; a compensação é feita entre os regimes. d) <strong>CORRETA</strong> — Paula terá direito à contagem recíproca dos dez anos, sem duplicidade e sem depender de compensação feita por ela mesma."
  },
  {
    id:10, banca:"CESPE", cargo:"Defensor Público do Estado de Alagoas/2017", type:"mc",
    e:"A respeito da contagem recíproca do tempo de serviço, julgue os itens a seguir. I - A contagem recíproca do tempo de serviço é admissível sempre que o segurado migrar do regime público de previdência social para o RGPS, e vice-versa. II - Para que a contagem recíproca do tempo de serviço seja admitida, o trabalhador deve indenizar o órgão previdenciário para o qual migrou. III - É vedada a contagem de tempo exercida concomitantemente no serviço público e na atividade privada. IV - A aposentadoria resultante da contagem recíproca do tempo de serviço deve ser rateada de forma proporcional por ambos os sistemas previdenciários para os quais o segurado tenha contribuído. Estão certos apenas os itens",
    opts:[
      "I e II.",
      "I e III.",
      "II e III.",
      "II e IV.",
      "III e IV."
    ],
    g:"B",
    c:"I <strong>correta</strong> (art. 40, §9º, CF). II <span class='arm'>incorreta</span> — não há previsão de indenização direta do trabalhador; os regimes se compensam financeiramente entre si, não o segurado. III <strong>correta</strong> (art. 96, II, Lei 8.213/91). IV <span class='arm'>incorreta</span> — não há rateio proporcional; o benefício é concedido e pago integralmente pelo regime ao qual o interessado estiver vinculado ao requerê-lo (art. 99, Lei 8.213/91). Corretas: I e III → alternativa B."
  }
];
let pool=[], cur=0, ans={}, nC=0, nE=0;
let mode='all', shuf=false;
let errs=new Set();
function loadE(){try{const s=localStorage.getItem(KEY);if(s)errs=new Set(JSON.parse(s))}catch(e){}}
function saveE(){try{localStorage.setItem(KEY,JSON.stringify([...errs]))}catch(e){}}
function init(){ loadE(); apply(); }
function apply(){
  ans={}; nC=0; nE=0; cur=0;
  let base=Q;
  if(mode==='cespe') base=Q.filter(q=>q.banca==='CESPE');
  else if(mode==='errors') base=Q.filter(q=>errs.has(q.id));
  if(!base.length){ showEmpty(); return; }
  pool=[...base];
  if(shuf){ for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];} }
  updStats(); render();
}
function setFilter(m){
  mode=m;
  ['All','Cespe','Errors'].forEach(x=>{
    const el=document.getElementById('b'+x);
    if(el) el.classList.toggle('on', m===x.toLowerCase());
  });
  apply();
}
function toggleShuffle(){
  shuf=!shuf;
  const b=document.getElementById('bShuffle');
  b.textContent=shuf?'🔀 Embaralhado ✓':'🔀 Embaralhar';
  b.classList.toggle('on',shuf);
  apply();
}
function resetAll(){ errs.clear(); saveE(); apply(); }
function updStats(){
  const tot=pool.length, done=nC+nE, pct=tot?Math.round(done/tot*100):0;
  document.getElementById('pbFill').style.width=pct+'%';
  document.getElementById('pbLabel').textContent=`${done} de ${tot} respondidas`;
  document.getElementById('hdCount').textContent=`${Math.min(cur+1,tot)}/${tot}`;
  document.getElementById('sC').textContent=nC+' acerto'+(nC!==1?'s':'');
  document.getElementById('sE').textContent=nE+' erro'+(nE!==1?'s':'');
  document.getElementById('sR').textContent=(tot-done)+' restante'+(tot-done!==1?'s':'');
}
function cls(opt,q,ua,done){
  if(!done) return opt==='C'?'cv':'ce';
  if(opt===ua) return ua===q.g?'sel-ok':'sel-ng';
  if(opt===q.g) return 'rev-ok';
  return opt==='C'?'cv':'ce';
}
function mcCls(letter,q,ua,done){
  if(!done) return '';
  if(letter===ua) return ua===q.g?'sel-ok':'sel-ng';
  if(letter===q.g) return 'rev-ok';
  return '';
}
function bancaBadgeCls(banca){
  return banca==='CESPE'?'b-cespe':banca==='Inédita'?'b-inedita':'b-outro';
}
function render(){
  if(cur>=pool.length){ showResults(); return; }
  const q=pool[cur], done=ans[cur]!==undefined, ua=ans[cur];
  const isOk=done&&ua===q.g;
  const isMC=q.type==='mc';
  const answerRowHtml = isMC ? `
      <div class="mc-col">
        ${q.opts.map((optText,i)=>{
          const letter=String.fromCharCode(65+i);
          return `<button class="mc-btn ${mcCls(letter,q,ua,done)}" onclick="answer('${letter}')" ${done?'disabled':''}><span class="lt">${letter})</span><span>${optText}</span></button>`;
        }).join('')}
      </div>` : `
      <div class="ans-row">
        <button class="ans-btn ${cls('C',q,ua,done)}" onclick="answer('C')" ${done?'disabled':''}>✓ CERTO</button>
        <button class="ans-btn ${cls('E',q,ua,done)}" onclick="answer('E')" ${done?'disabled':''}>✗ ERRADO</button>
      </div>`;
  const stampHtml = isMC
    ? `<div class="stamp stc">GABARITO ${q.g}</div>`
    : `<div class="stamp ${q.g==='C'?'stc':'ste'}">${q.g==='C'?'CERTO':'ERRADO'}</div>`;
  const gabaritoLabel = isMC ? q.g : (q.g==='C'?'CERTO':'ERRADO');
  document.getElementById('area').innerHTML=`
  <div class="cw">
    <div class="card" id="card">
      <div class="stamp-ov" id="stamp">
        ${stampHtml}
      </div>
      <div class="card-meta">
        <span class="badge b-num">Q${cur+1}</span>
        <span class="badge ${bancaBadgeCls(q.banca)}">${q.banca}</span>
        ${isMC?'<span class="badge b-mc">Múltipla escolha</span>':''}
        <span class="card-cargo">${q.cargo}</span>
      </div>
      <div class="card-body">
        <div class="enunciado">${q.e}</div>
      </div>
      ${answerRowHtml}
      ${done?`
      <div class="fb show ${isOk?'ok':'ng'}">
        <div class="fb-hd">${isOk?'✅ Correto! Gabarito: ':'❌ Errado! Gabarito: '}<strong>${gabaritoLabel}</strong></div>
        <div class="fb-bd">${q.c}</div>
      </div>
      <div class="nav-row">
        ${cur>0?`<button class="nav-btn" onclick="go(${cur-1})">← Anterior</button>`:'<div></div>'}
        ${cur<pool.length-1
          ?`<button class="nav-btn nx" onclick="go(${cur+1})">Próxima →</button>`
          :`<button class="nav-btn nx" onclick="showResults()">🏁 Ver resultado</button>`}
      </div>`:''}
    </div>
  </div>`;
  if(done) setTimeout(()=>{const s=document.getElementById('stamp');if(s)s.classList.add('show');},60);
  updStats();
}
function answer(ch){
  if(ans[cur]!==undefined) return;
  const q=pool[cur];
  ans[cur]=ch;
  if(ch===q.g) nC++;
  else{ nE++; errs.add(q.id); saveE(); }
  render();
  setTimeout(()=>{const s=document.getElementById('stamp');if(s)s.classList.add('show');},90);
}
function go(i){ cur=i; render(); }
function showEmpty(){
  document.getElementById('area').innerHTML=`
  <div class="empty">
    <div class="ico">📭</div>
    <h3>Nenhuma questão aqui</h3>
    <p>${mode==='errors'?'Sem erros registrados nesta aula. Parabéns! 🎉':'Nenhuma questão encontrada com este filtro.'}</p>
  </div>`;
}
function showResults(){
  const tot=pool.length, pct=tot?Math.round(nC/tot*100):0;
  const ico=pct>=80?'🏆':pct>=60?'💪':'📚';
  document.getElementById('area').innerHTML=`
  <div class="results">
    <div class="r-ico">${ico}</div>
    <h2>Resultado Final</h2>
    <p style="color:var(--muted);font-size:13.5px">INSS · Aula 17 — Contagem Recíproca e Compensação Financeira</p>
    <div class="r-score">${pct}%</div>
    <div class="r-grid">
      <div class="r-stat g"><div class="n">${nC}</div><div class="lbl">Acertos</div></div>
      <div class="r-stat r"><div class="n">${nE}</div><div class="lbl">Erros</div></div>
      <div class="r-stat"><div class="n">${tot}</div><div class="lbl">Total</div></div>
      <div class="r-stat"><div class="n">${errs.size}</div><div class="lbl">No caderno</div></div>
    </div>
    ${nE>0?`<button class="r-btn main" onclick="setFilter('errors')">Refazer só os erros (${nE})</button>`:''}
    <button class="r-btn sec" onclick="resetAll()">↺ Recomeçar do zero</button>
  </div>`;
  document.getElementById('pbFill').style.width='100%';
  document.getElementById('pbLabel').textContent=`${tot} de ${tot} respondidas`;
  updStats();
}
init();
</script>
</body>
</html>
